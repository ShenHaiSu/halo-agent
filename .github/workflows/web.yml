# need22-P5 J3：前端 CI 门禁（E3 对等）。
# pnpm i --frozen-lockfile → typecheck → selfcheck → build；红灯阻断合入。
name: web

on:
  push:
    paths:
      - "src/Web.Client/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "src/Web.Client/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

jobs:
  web:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src/Web.Client
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version-file: src/Web.Client/.nvmrc

      - name: Install (--frozen-lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Selfcheck
        run: pnpm selfcheck

      - name: Build
        run: pnpm build
