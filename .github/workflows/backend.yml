# need22-P4 H4：后端 CI 门禁（E3）。
# clean → build --no-restore → test → publish(-r win-x64 --self-contained true) → 禁单文件断言 → 签名状态。
# CI 红灯不阻塞 P0–P3 热修：保留 workflow_dispatch 手动通道。
name: backend

on:
  push:
    paths:
      - "src/Host.Desktop/**"
      - "tests/HaloAgent.Tests/**"
      - "HaloAgent.sln"
      - "global.json"
      - "NuGet.config"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "build/**"
      - ".config/dotnet-tools.json"
      - ".editorconfig"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "src/Host.Desktop/**"
      - "tests/HaloAgent.Tests/**"
      - "HaloAgent.sln"
      - "global.json"
      - "NuGet.config"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "build/**"
      - ".config/dotnet-tools.json"
      - ".editorconfig"
  workflow_dispatch:

jobs:
  backend:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 6.0.428
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.0.428"

      # H5：CI 首步清理
      - name: Clean (build/clean.cmd)
        shell: cmd
        run: build\clean.cmd

      - name: Restore
        run: dotnet restore HaloAgent.sln -r win-x64

      - name: Format check (csharpier)
        run: |
          dotnet tool restore
          dotnet dotnet-csharpier ./src ./tests --check

      - name: Build (Release, warnings-as-errors)
        run: dotnet build HaloAgent.sln -c Release --no-restore

      - name: Test
        run: dotnet test HaloAgent.sln -c Release --no-build --logger "console;verbosity=normal"
      - name: Resolve version (git tag → Assembly/iss)
        id: version
        run: |
          $tag = ""
          try { $tag = (git describe --tags --abbrev=0 2>$null) } catch { $tag = "" }
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "v0.6.0" }
          $ver = $tag.TrimStart("v")
          echo "MYAPPVERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          echo "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Resolved version: $ver (from tag '$tag')"

      - name: Publish (win-x64, self-contained, multi-file)
        run: >
          dotnet publish src/Host.Desktop/Host.Desktop.csproj -c Release
          -r win-x64 --self-contained true
          -p:PublishSingleFile=false -p:PublishReadyToRun=false
          -p:VersionPrefix=${{ env.MYAPPVERSION }}
          -o artifacts/publish/win-x64

      # 铁律门禁：CefSharp 109 原生件要求多文件；一旦 PublishSingleFile=true 即炸
      - name: Assert NOT single-file (E3)
        run: |
          $dir = "artifacts/publish/win-x64"
          if (-not (Test-Path "$dir/Host.Desktop.exe")) { Write-Error "publish output missing Host.Desktop.exe"; exit 1 }
          if (-not (Test-Path "$dir/libcef.dll")) { Write-Error "SINGLE-FILE SUSPECTED: libcef.dll missing in $dir (PublishSingleFile must stay false)"; exit 1 }
          $count = (Get-ChildItem $dir -File | Measure-Object).Count
          Write-Host "publish files: $count (multi-file OK)"
          if ($count -lt 10) { Write-Error "SINGLE-FILE SUSPECTED: only $count files published"; exit 1 }

      # H6：签名状态输出（无证书=自签占位，不阻断）
      - name: Sign status
        shell: cmd
        run: build\sign.cmd artifacts\publish\win-x64
